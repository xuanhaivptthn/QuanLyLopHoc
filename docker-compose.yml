services:
  postgres:
    image: postgres:16-alpine
    container_name: quanlylophoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quanly_lophoc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quanly_lophoc"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional database management UI (accessible at http://localhost:5050)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: quanlylophoc-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
